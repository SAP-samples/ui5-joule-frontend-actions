<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />

		<title>Joule Frontend Actions in FLP</title>

		<script>
			window["sap-ushell-config"] = {
				defaultRenderer: "fiori2",
				ushell: {
					shellBar: {
						enabled: true // Required since 1.143: Joule plugin targets the new ShellBar web component
					}
				},
				renderers: {
					fiori2: {
						componentData: {
							config: {
								enableSearch: false,
								enableSetTheme: true
							}
						}
					}
				},
				bootstrapPlugins: {
					DigitalAssistant: {
						component: "sap.das.webclientplugin.s4",
						url: "https://uics-joule.eu12.sapdas.cloud.sap/resources/public/webclient/s4",
						config: {
							defaultBotName: ""
						}
					}
				},
				applications: {
					"UI5Frontend-actions": {
						title: "UI5 Frontend Actions",
						additionalInformation: "SAPUI5.Component=test.my.frontend.actions",
						applicationType: "URL",
						url: ".",
						navigationMode: "embedded",
						description: "Demo App for UI5 Frontend Actions"
					},
				},
				services: {
					Container: {
						adapter: {
							module: "sap.ushell.adapters.local.ContainerAdapter",
							config: {
								id: "DEFAULT_USER",
								firstName: "Default",
								lastName: "User",
								email: "default.user@sap.com",
								fullName: "Default User",
								accessibility: false,
								isJamActive: false,
								language: "en",
								bootTheme: {
									theme: "sap_horizon",
									root: ""
								},
								themeRoot: "/sap/public/bc/themes/",
								setAccessibilityPermitted: true,
								setThemePermitted: true,
								isLanguagePersonalized: false,
								setContentDensityPermitted: true,
								trackUsageAnalytics: null
							}
						}
					},
					NavTargetResolution: {
						config: {
							enableClientSideTargetResolution: true
						}
					},
					ClientSideTargetResolution: {
						adapter: {
							config: {
								inbounds: {
									"DASBot-my_frontend_actions": {
										semanticObject: "DASBot",
										action: "my_frontend_actions",
										title: "DASBot my_frontend_actions",
										signature: {
											parameters: {},
											additionalParameters: "allowed"
										},
										resolutionResult: {
											applicationType: "URL",
											url: "./"
										}
									}
								}
							}
						}
					}
				}
			};
		</script>

		<script id="sap-ushell-bootstrap"
			src="https://ui5.sap.com/1.153.0/test-resources/sap/ushell/bootstrap/sandbox.js">
		</script>

		<script
			id="sap-ui-bootstrap"
			src="https://ui5.sap.com/1.153.0/resources/sap-ui-core.js"
			data-sap-ui-resource-roots='{
				"test.my.frontend.actions": "./"
			}'
			data-sap-ui-on-init="renderFLP"
			data-sap-ui-compat-version="edge"
			data-sap-ui-frame-options="trusted"
			data-sap-ui-async="true"
			data-sap-ui-libs="sap.ui.core,sap.ushell,sap.m">
		</script>

		<script type="text/javascript">
			window.renderFLP = async () => {
				(await sap.ushell.Container.createRenderer(undefined, true)).placeAt("content");
			};
		</script>
	</head>

	<body class="sapUiBody sapUShellFullHeight" id="content">
	</body>
</html>
